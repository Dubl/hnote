<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HNote — Tagger</title>
<style>
  :root{
    --bg:#17151d; --surface:#201d28; --line:#38334a; --text:#efeae2; --muted:#8d8798;
    --good:#3ec9b0; --bad:#ef6351; --accent:#f5a524;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:16px 12px 60px; max-width:560px; margin-inline:auto;}
  h1{font-size:13px; letter-spacing:.25em; text-transform:uppercase; color:var(--accent); margin:0 0 10px;}
  audio{width:100%; display:block; margin-bottom:6px;}
  .pos{font-size:12px; color:var(--muted); text-align:center; margin-bottom:14px; font-variant-numeric:tabular-nums;}
  .groups{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .group{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px;}
  .group h2{font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
    margin:0 0 8px; text-align:center;}
  .btns{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  button.tag{border:none; border-radius:10px; padding:16px 4px; font-size:13px; font-weight:700;
    color:#10131a; cursor:pointer; line-height:1.25;}
  button.tag small{display:block; font-weight:400; font-size:10px; opacity:.75;}
  .good{background:var(--good);} .bad{background:var(--bad);}
  .prev{opacity:.62;}
  button.tag:active{transform:scale(.95);}
  .toolbar{display:flex; gap:8px; margin-top:14px;}
  .toolbar button{flex:1; background:var(--surface); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:12px; font-size:13px; cursor:pointer;}
  #log{margin-top:14px; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums;}
  #log div{padding:5px 8px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center;}
  #log .g{color:var(--good);} #log .b{color:var(--bad);}
  #log button{background:none; border:none; color:var(--muted); font-size:14px; cursor:pointer; padding:2px 6px;}
  #flash{position:fixed; top:10px; left:50%; transform:translateX(-50%); background:var(--accent);
    color:#10131a; font-weight:700; font-size:13px; padding:8px 18px; border-radius:20px;
    opacity:0; transition:opacity .15s; pointer-events:none;}
</style>
</head>
<body>
<h1>HNote Tagger</h1>
<audio id="a" controls preload="metadata" src="song2x8_browse.mp3"></audio>
<div class="pos" id="pos">unit — · bar —</div>

<div class="groups">
  <div class="group">
    <h2>Melody</h2>
    <div class="btns">
      <button class="tag good" data-l="melody" data-r="cur" data-v="good">Good<small>current</small></button>
      <button class="tag bad"  data-l="melody" data-r="cur" data-v="bad">Bad<small>current</small></button>
      <button class="tag good prev" data-l="melody" data-r="prev" data-v="good">Good<small>previous</small></button>
      <button class="tag bad prev"  data-l="melody" data-r="prev" data-v="bad">Bad<small>previous</small></button>
    </div>
  </div>
  <div class="group">
    <h2>Drums</h2>
    <div class="btns">
      <button class="tag good" data-l="drums" data-r="cur" data-v="good">Good<small>current</small></button>
      <button class="tag bad"  data-l="drums" data-r="cur" data-v="bad">Bad<small>current</small></button>
      <button class="tag good prev" data-l="drums" data-r="prev" data-v="good">Good<small>previous</small></button>
      <button class="tag bad prev"  data-l="drums" data-r="prev" data-v="bad">Bad<small>previous</small></button>
    </div>
  </div>
</div>

<div class="toolbar">
  <button id="copy">Copy tags</button>
  <button id="clear">Clear all</button>
</div>
<div id="log"></div>
<div id="flash"></div>

<script>
const KEY='hnote_tags_v1', UNIT=16.0, BARLEN=8.0;
const a=document.getElementById('a'), log=document.getElementById('log'),
      pos=document.getElementById('pos'), flash=document.getElementById('flash');
let tags=JSON.parse(localStorage.getItem(KEY)||'[]');

const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const unitOf=t=>Math.floor(t/UNIT)+1, barOf=t=>Math.floor((t%UNIT)/BARLEN)+1;

setInterval(()=>{ if(!a.duration) return;
  pos.textContent=`unit ${unitOf(a.currentTime)} · bar ${barOf(a.currentTime)} · ${fmt(a.currentTime)}`;
},250);

function save(){ localStorage.setItem(KEY,JSON.stringify(tags)); render(); }
function render(){
  log.innerHTML='';
  [...tags].reverse().forEach((t,ri)=>{
    const i=tags.length-1-ri, d=document.createElement('div');
    d.innerHTML=`<span>${fmt(t.t)} · u${t.unit} b${t.bar} · ${t.layer} ${t.ref} ·
      <span class="${t.v==='good'?'g':'b'}">${t.v.toUpperCase()}</span></span>`;
    const x=document.createElement('button'); x.textContent='✕';
    x.onclick=()=>{ tags.splice(i,1); save(); };
    d.appendChild(x); log.appendChild(d);
  });
}
function show(msg){ flash.textContent=msg; flash.style.opacity=1;
  setTimeout(()=>flash.style.opacity=0,700); }

document.querySelectorAll('button.tag').forEach(b=>b.onclick=()=>{
  const now=a.currentTime, ref=b.dataset.r;
  const t=ref==='prev'? Math.max(0,now-UNIT) : now;   // previous = one unit back
  const tag={t:Math.round(t*10)/10, unit:unitOf(t), bar:barOf(t),
             layer:b.dataset.l, ref, v:b.dataset.v};
  tags.push(tag); save();
  if(navigator.vibrate) navigator.vibrate(30);
  show(`${tag.layer} u${tag.unit} ${tag.v.toUpperCase()}`);
});

document.getElementById('copy').onclick=async()=>{
  const lines=tags.map(t=>`u${t.unit} b${t.bar} @${t.t}s ${t.layer} ${t.ref} ${t.v}`);
  const text=`hnote tags v1 (track: song2x8 browse, unit=16s, bar=8s)\n`+lines.join('\n');
  try{ await navigator.clipboard.writeText(text); show('copied'); }
  catch(e){ prompt('copy this:', text); }
};
document.getElementById('clear').onclick=()=>{
  if(confirm('Delete all tags?')){ tags=[]; save(); }
};
render();
</script>
</body>
</html>
