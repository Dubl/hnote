<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steamroller — 100 Beats</title>
<style>
  :root{
    --bg:#17151d; --surface:#201d28; --line:#38334a;
    --text:#efeae2; --muted:#8d8798; --accent:#f5a524;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:20px; line-height:1.5;}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:16px;
    padding:28px 24px; max-width:520px; width:100%;}
  h1{font-size:14px; letter-spacing:.28em; text-transform:uppercase; margin:0 0 2px;
    font-weight:700; color:var(--accent);}
  h2{font-size:20px; margin:0 0 10px; font-weight:700;}
  p{font-size:13.5px; color:var(--muted); margin:0 0 20px;}
  audio{width:100%; display:block;}
  .dl{font-size:12px; color:var(--muted); margin-top:14px; text-align:center;}
  .dl a{color:var(--accent); text-decoration:none;}
</style>
</head>
<body>
<div class="card">
  <h1>Glass</h1>
  <audio controls preload="metadata" src="https://github.com/dubl/hnote/releases/download/audio-v1/random_beats_steam.mp3"></audio>
  <div class="dl"><a href="https://github.com/dubl/hnote/releases/download/audio-v1/random_beats_steam.mp3" download>download .mp3</a></div>
</div>
</body>
</html>
