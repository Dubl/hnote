<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HNote — Uberloop Performer</title>
<style>
  :root{
    --bg:#17151d; --surface:#201d28; --line:#38334a; --text:#efeae2; --muted:#8d8798;
    --accent:#f5a524; --win:#3ec9b0; --rec:#ef6351;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:16px 12px 60px; max-width:640px; margin-inline:auto;}
  h1{font-size:13px; letter-spacing:.25em; text-transform:uppercase; color:var(--accent); margin:0 0 2px;}
  .sub{font-size:12px; color:var(--muted); margin-bottom:12px;}
  .bar{background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .bar .lbl{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); flex-shrink:0;}
  select{flex:1; background:#2a2635; color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:10px; font-size:14px;}
  #lanes{background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:8px 6px; margin-bottom:6px; position:relative;}
  .lane{display:flex; align-items:center; height:26px;}
  .lname{width:44px; font-size:9px; color:var(--muted); text-transform:uppercase; flex-shrink:0;}
  .ltrack{position:relative; flex:1; height:100%;}
  .gridline{position:absolute; top:0; bottom:0; width:1px; background:#2a2635;}
  .hit{position:absolute; top:50%; width:9px; height:9px; margin:-4.5px 0 0 -4.5px;
    border-radius:50%; background:var(--accent); pointer-events:none;}
  .hit.bass{background:var(--win); border-radius:2px;}
  #winlay{position:relative; height:40px; background:var(--surface);
    border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden;}
  .win{position:absolute; top:0; bottom:0; background:rgba(62,201,176,.20);
    border-left:3px solid var(--win); border-right:3px solid var(--win); cursor:grab;}
  .win .wlabel{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:10px; color:var(--win); font-weight:700; pointer-events:none; white-space:nowrap;}
  .handle{position:absolute; top:0; bottom:0; width:22px; cursor:ew-resize;}
  .handle.l{left:-11px;} .handle.r{right:-11px;}
  .nudges{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:10px;}
  .nudges button{border:none; border-radius:8px; padding:11px 2px; font-size:11.5px; font-weight:700;
    background:#2a2635; color:var(--text); cursor:pointer;}
  .decks{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;}
  .deck{border:none; border-radius:14px; padding:26px 8px; font-size:16px; font-weight:800;
    letter-spacing:.08em; cursor:pointer; color:#10131a; position:relative;}
  #playfull{background:var(--accent);} #playwin{background:var(--win);}
  .deck.active{box-shadow:0 0 0 4px rgba(239,234,226,.35) inset;}
  .deck.queued{animation:pulse .5s infinite alternate;}
  @keyframes pulse{from{filter:brightness(1);}to{filter:brightness(1.45);}}
  .deck small{display:block; font-weight:400; font-size:10px; margin-top:4px; opacity:.7;}
  .ctl{display:flex; gap:8px; margin-bottom:10px;}
  .ctl button, .ctl select{flex:1; background:var(--surface); color:var(--text);
    border:1px solid var(--line); border-radius:10px; padding:12px; font-size:13px; cursor:pointer;}
  #stopbtn{color:var(--rec);}
  #recbar{font-size:11.5px; color:var(--muted); text-align:center; margin-bottom:10px;
    font-variant-numeric:tabular-nums; min-height:16px;}
  #recbar .on{color:var(--rec); font-weight:700;}
  .toolbar{display:flex; gap:8px;}
  .toolbar button{flex:1; background:var(--surface); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:12px; font-size:13px; cursor:pointer;}
  #flash{position:fixed; top:10px; left:50%; transform:translateX(-50%); background:var(--accent);
    color:#10131a; font-weight:700; font-size:13px; padding:8px 18px; border-radius:20px;
    opacity:0; transition:opacity .15s; pointer-events:none;}
</style>
</head>
<body>
<h1>Uberloop Performer</h1>
<div class="sub">Two decks: the full uberloop and the window. Launch either; switching is
quantized so the clock never breaks. Everything you play is captured as MIDI.</div>

<div class="bar">
  <span class="lbl">Uberloop</span><select id="beatsel"></select>
  <span class="lbl">Quantize</span>
  <select id="qsel" style="flex:.7;"><option value="pulse">pulse</option><option value="loop">loop end</option></select>
</div>

<div id="lanes"></div>
<div id="winlay"></div>
<div class="nudges">
  <button id="s-m">&#9664; start</button><button id="s-p">start &#9654;</button>
  <button id="e-m">&#9664; end</button><button id="e-p">end &#9654;</button>
</div>

<div class="decks">
  <button class="deck" id="playfull">FULL<small id="fullinfo"></small></button>
  <button class="deck" id="playwin">WINDOW<small id="wininfo"></small></button>
</div>
<div class="ctl">
  <button id="stopbtn">&#9632; Stop</button>
</div>
<div id="recbar"></div>
<div class="toolbar">
  <button id="dl">Download MIDI take</button>
  <button id="cleartake">Clear take</button>
</div>
<div id="flash"></div>

<script src="perform_data.js"></script>
<script>
const GM={36:'kick',38:'snare',42:'chat',56:'cowb',75:'clave'};
const KEY='hnote_perform_v1';
const st=JSON.parse(localStorage.getItem(KEY)||'{}');
let beatIdx=st.beatIdx??0;
let winsBy=st.winsBy??{};
const NUDGE=0.1;

const beatsel=document.getElementById('beatsel');
PERF.beats.forEach((b,i)=>beatsel.add(new Option(`${b.name} — ${b.desc}`,i)));
beatsel.value=beatIdx;
beatsel.onchange=()=>{ beatIdx=+beatsel.value; queue=null; if(playing){ playing=false; clearInterval(timer); markDecks(); } redraw(); persist(); };

function B(){ return PERF.beats[beatIdx]; }
function W(){ return winsBy[B().name]??[1.0,Math.min(3.0,B().barlen)]; }
function setW(w){ winsBy[B().name]=w; persist(); }
function persist(){ localStorage.setItem(KEY,JSON.stringify({beatIdx,winsBy})); }

// --- timeline ---
function redraw(){
  const el=document.getElementById('lanes'); el.innerHTML='';
  const bl=B().barlen;
  const voices=[...new Set(B().hits.filter(h=>h[3]===9).map(h=>h[1]))].sort((a,b)=>a-b);
  voices.push('bass');
  voices.forEach(v=>{
    const lane=document.createElement('div'); lane.className='lane';
    lane.innerHTML=`<div class="lname">${v==='bass'?'bass':(GM[v]||v)}</div>`;
    const tr=document.createElement('div'); tr.className='ltrack';
    const npulse=Math.round(bl/PERF.pulse);
    for(let k=1;k<npulse;k++){
      const g=document.createElement('div'); g.className='gridline'; g.style.left=(k/npulse*100)+'%';
      tr.appendChild(g);
    }
    B().hits.filter(h=> v==='bass' ? h[3]===3 : (h[3]===9&&h[1]===v)).forEach(h=>{
      const d=document.createElement('div'); d.className='hit'+(v==='bass'?' bass':'');
      d.style.left=(h[0]/bl*100)+'%'; tr.appendChild(d);
    });
    lane.appendChild(tr); el.appendChild(lane);
  });
  drawWin();
  document.getElementById('fullinfo').textContent=`${bl.toFixed(2)}s loop`;
  const w=W();
  document.getElementById('wininfo').textContent=`${w[0].toFixed(2)}–${w[1].toFixed(2)}s (${(w[1]-w[0]).toFixed(2)}s loop)`;
}
const winlay=document.getElementById('winlay');
function drawWin(){
  winlay.innerHTML='';
  const bl=B().barlen, w=W();
  const d=document.createElement('div'); d.className='win';
  d.style.left=(w[0]/bl*100)+'%'; d.style.width=((w[1]-w[0])/bl*100)+'%';
  d.innerHTML=`<div class="wlabel">[${w[0].toFixed(2)}, ${w[1].toFixed(2)})</div>`;
  const hl=document.createElement('div'); hl.className='handle l';
  const hr=document.createElement('div'); hr.className='handle r';
  d.appendChild(hl); d.appendChild(hr);
  let mode=null,x0=0,w0=null;
  const px2s=dx=>dx/winlay.clientWidth*bl;
  const down=(e,m)=>{ mode=m; x0=e.clientX; w0=[...W()]; e.preventDefault();
    e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId); };
  d.onpointerdown=e=>{ if(e.target===d) down(e,'move'); };
  hl.onpointerdown=e=>down(e,'l');
  hr.onpointerdown=e=>down(e,'r');
  const move=e=>{
    if(mode===null) return;
    const ds=px2s(e.clientX-x0);
    let w=[...W()];
    if(mode==='move'){ const len=w0[1]-w0[0];
      let a=Math.max(0,Math.min(w0[0]+ds,bl-len)); w=[a,a+len]; }
    if(mode==='l') w=[Math.max(0,Math.min(w0[0]+ds,W()[1]-0.5)),W()[1]];
    if(mode==='r') w=[W()[0],Math.min(bl,Math.max(w0[1]+ds,W()[0]+0.5))];
    setW([Math.round(w[0]*100)/100,Math.round(w[1]*100)/100]);
    drawWin(); document.getElementById('wininfo').textContent=
      `${W()[0].toFixed(2)}–${W()[1].toFixed(2)}s (${(W()[1]-W()[0]).toFixed(2)}s loop)`;
  };
  const up=()=>{ mode=null; };
  d.onpointermove=hl.onpointermove=hr.onpointermove=move;
  d.onpointerup=hl.onpointerup=hr.onpointerup=up;
  winlay.appendChild(d);
}
function nudge(edge,dd){
  const bl=B().barlen; let w=[...W()];
  if(edge==='s') w=[Math.max(0,Math.min(w[0]+dd,w[1]-0.5)),w[1]];
  else w=[w[0],Math.min(bl,Math.max(w[1]+dd,w[0]+0.5))];
  setW([Math.round(w[0]*100)/100,Math.round(w[1]*100)/100]); redraw();
}
document.getElementById('s-m').onclick=()=>nudge('s',-NUDGE);
document.getElementById('s-p').onclick=()=>nudge('s',NUDGE);
document.getElementById('e-m').onclick=()=>nudge('e',-NUDGE);
document.getElementById('e-p').onclick=()=>nudge('e',NUDGE);

// --- samples ---
const SF='https://storage.googleapis.com/magentadata/js/soundfonts/sgm_plus';
const VLEV=[15,31,47,63,79,95,111,127];
let actx=null, samples={};
async function loadSamples(){
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const need=new Set();
  PERF.beats.forEach(b=>b.hits.forEach(([t,p,v,ch])=>{
    if(ch===3){ need.add('bass/'+p); return; }
    const vl=VLEV.reduce((a,c)=>Math.abs(c-v)<Math.abs(a-v)?c:a);
    need.add('percussion/'+p+'_'+vl);
  }));
  let done=0; const keys=[...need];
  await Promise.all(keys.map(async k=>{
    try{
      let url;
      if(k.startsWith('bass/')){
        url=`bass_samples/p${k.split('/')[1]}.mp3`;   // GeneralUser GS render - the mp3's bass
      }else{
        const [p,vl]=k.split('/')[1].split('_');
        url=`${SF}/percussion/p${p}_v${vl}.mp3`;
      }
      const r=await fetch(url);
      if(!r.ok) throw 0;
      samples[k]=await actx.decodeAudioData(await r.arrayBuffer());
    }catch(e){ samples[k]=null; }
    status(`samples ${++done}/${keys.length}`);
  }));
}
function status(m){ document.getElementById('recbar').textContent=m; }

// --- performance engine: lookahead scheduler + quantized switching ---
let playing=false, active=null, queue=null;
let t0=0, segStart=0, segPos=0;       // segment = current loop occupancy
let take=[], takeStart=null, timer=null, schedUntil=0;
function loopSpec(which){
  const w=W();
  return which==='full' ? {off:0, len:B().barlen} : {off:w[0], len:w[1]-w[0]};
}
function hitsIn(which, from, to){
  // hits of the active loop mapped onto performance-time [from,to)
  const {off,len}=loopSpec(which);
  const out=[];
  let iter=Math.floor((from-segStart)/len);
  for(; iter*len+segStart<to; iter++){
    const base=segStart+iter*len;
    B().hits.forEach(([t,p,v,ch])=>{
      if(t>=off-1e-9 && t<off+len-1e-9){
        const at=base+(t-off);
        if(at>=from-1e-9 && at<to-1e-9) out.push([at,p,v,ch]);
      }
    });
  }
  return out;
}
function schedule(){
  if(!playing) return;
  const now=actx.currentTime, until=now+0.18;
  // handle a queued switch inside the horizon
  while(true){
    let boundary=Infinity;
    if(queue){
      const q=document.getElementById('qsel').value;
      if(q==='pulse'){
        boundary=t0+Math.ceil((Math.max(schedUntil,now)-t0)/PERF.pulse-1e-9)*PERF.pulse;
      }else{
        const {len}=loopSpec(active);
        boundary=segStart+Math.ceil((Math.max(schedUntil,now)-segStart)/len-1e-9)*len;
      }
    }
    const to=Math.min(until,boundary);
    if(to>schedUntil){
      hitsIn(active,schedUntil,to).forEach(h=>playHit(h));
      schedUntil=to;
    }
    if(queue && boundary<=until){
      active=queue; queue=null; segStart=boundary; markDecks();
    } else break;
  }
  updateRec();
}
function playHit([at,p,v,ch]){
  let buf,gain;
  if(ch===3){ buf=samples['bass/'+p]; gain=v/110; }
  else{
    const vl=VLEV.reduce((a,c)=>Math.abs(c-v)<Math.abs(a-v)?c:a);
    buf=samples['percussion/'+p+'_'+vl]; gain=Math.min(1.4,v/vl);
  }
  if(buf){
    const s=actx.createBufferSource(); s.buffer=buf;
    const g=actx.createGain(); g.gain.value=gain;
    s.connect(g); g.connect(actx.destination); s.start(at);
    if(ch===3){ try{s.stop(at+0.16);}catch(_){} }
  }
  if(takeStart===null) takeStart=at;
  take.push([at-takeStart,p,v,ch]);
}
function markDecks(){
  document.getElementById('playfull').classList.toggle('active',playing&&active==='full');
  document.getElementById('playwin').classList.toggle('active',playing&&active==='win');
  document.getElementById('playfull').classList.toggle('queued',queue==='full');
  document.getElementById('playwin').classList.toggle('queued',queue==='win');
}
async function launch(which){
  if(!actx||!Object.keys(samples).length){
    document.getElementById('playfull').disabled=document.getElementById('playwin').disabled=true;
    await loadSamples();
    document.getElementById('playfull').disabled=document.getElementById('playwin').disabled=false;
  }
  if(actx.state==='suspended') await actx.resume();
  if(!playing){
    playing=true; active=which;
    t0=actx.currentTime+0.12; segStart=t0; schedUntil=t0;
    timer=setInterval(schedule,50);
  }else if(active!==which){
    queue=which;
  }
  markDecks();
}
document.getElementById('playfull').onclick=()=>launch('full');
document.getElementById('playwin').onclick=()=>launch('win');
document.getElementById('stopbtn').onclick=()=>{
  playing=false; queue=null; clearInterval(timer); markDecks(); updateRec();
};
function updateRec(){
  const el=document.getElementById('recbar');
  if(take.length){
    el.innerHTML=`<span class="on">&#9679; take</span> ${take.length} notes · ${(take[take.length-1][0]).toFixed(1)}s`;
  } else el.textContent= playing? 'playing' : 'ready';
}

// --- MIDI take writer (format 0, 480 PPQ, tempo 500000) ---
function vlq(n){ const b=[n&0x7f]; n>>=7; while(n){ b.push(0x80|(n&0x7f)); n>>=7; } return b.reverse(); }
document.getElementById('dl').onclick=()=>{
  if(!take.length) return show('no take yet');
  const PPQ=480,T=500000, tick=s=>Math.round(s*1e6*PPQ/T);
  const ev=[[0,0,[0xFF,0x51,0x03,(T>>16)&255,(T>>8)&255,T&255]],[0,0,[0xC3,39]]];
  take.forEach(([t,p,v,ch])=>{
    const st=ch===3?0x93:0x99, en=ch===3?0x83:0x89;
    const dur=ch===3?0.14:0.06;
    ev.push([tick(t),1,[st,p,v]]);
    ev.push([tick(t+dur),0,[en,p,0]]);
  });
  ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const tr=[]; let last=0;
  ev.forEach(([t,,b])=>{ tr.push(...vlq(t-last),...b); last=t; });
  tr.push(0,0xFF,0x2F,0);
  const head=[0x4D,0x54,0x68,0x64,0,0,0,6,0,0,0,1,PPQ>>8,PPQ&255,
              0x4D,0x54,0x72,0x6B,(tr.length>>24)&255,(tr.length>>16)&255,(tr.length>>8)&255,tr.length&255];
  const blob=new Blob([new Uint8Array([...head,...tr])],{type:'audio/midi'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`take_${B().name}_${Date.now()%100000}.mid`;
  a.click();
  show('take downloaded');
};
document.getElementById('cleartake').onclick=()=>{ take=[]; takeStart=null; updateRec(); show('take cleared'); };
function show(m){ const f=document.getElementById('flash');
  f.textContent=m; f.style.opacity=1; setTimeout(()=>f.style.opacity=0,800); }
redraw(); updateRec();
</script>
</body>
</html>
