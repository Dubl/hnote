<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HNote — Uberloop Board</title>
<style>
  :root{
    --bg:#17151d; --surface:#201d28; --line:#38334a; --text:#efeae2; --muted:#8d8798;
    --accent:#f5a524; --win:#3ec9b0; --rec:#ef6351;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;}
  body{margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:16px 12px 60px; max-width:640px; margin-inline:auto;}
  h1{font-size:13px; letter-spacing:.25em; text-transform:uppercase; color:var(--accent); margin:0 0 2px;}
  .sub{font-size:12px; color:var(--muted); margin-bottom:12px;}
  .bar{background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin-bottom:10px; display:flex; align-items:center; gap:8px;}
  .bar .lbl{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); flex-shrink:0;}
  .bar select{flex:1; background:#2a2635; color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:10px; font-size:14px;}
  #stopbtn{background:#2a2635; color:var(--rec); border:1px solid var(--line);
    border-radius:8px; padding:10px 16px; font-size:14px; font-weight:700; cursor:pointer;}
  .row{background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:10px 12px; margin-bottom:8px; display:flex; align-items:center; gap:8px;}
  .rinfo{flex:1; min-width:0;}
  .rname{font-size:13px; font-weight:700;}
  .rdesc{font-size:10.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .deck{border:none; border-radius:10px; padding:16px 0; width:74px; font-size:12px; font-weight:800;
    letter-spacing:.05em; cursor:pointer; color:#10131a; flex-shrink:0;}
  .deck.full{background:var(--accent);} .deck.win{background:var(--win);}
  .deck.active{box-shadow:0 0 0 3px rgba(239,234,226,.5) inset;}
  .deck.queued{animation:pulse .5s infinite alternate;}
  @keyframes pulse{from{filter:brightness(1);}to{filter:brightness(1.5);}}
  .deck small{display:block; font-weight:400; font-size:9px; margin-top:2px; opacity:.75;}
  .gear{background:none; border:none; color:var(--muted); font-size:16px; cursor:pointer; padding:4px; flex-shrink:0;}
  .winedit{display:none; background:var(--surface); border:1px solid var(--line); border-radius:10px;
    margin:-4px 0 8px; padding:8px;}
  .winedit.show{display:block;}
  .viz{position:relative; height:58px; background:#17151d; border:1px solid var(--line);
    border-radius:8px; margin-bottom:8px; overflow:hidden;}
  .viz .g{position:absolute; top:0; bottom:0; width:1px; background:#26222f;}
  .viz .h{position:absolute; width:7px; height:7px; margin:-3.5px 0 0 -3.5px;
    border-radius:50%; background:var(--accent); pointer-events:none;}
  .viz .h.bass{background:var(--win); border-radius:2px;}
  .viz .wreg{position:absolute; top:0; bottom:0; background:rgba(62,201,176,.20);
    border-left:3px solid var(--win); border-right:3px solid var(--win); cursor:grab;}
  .viz .handle{position:absolute; top:0; bottom:0; width:20px; cursor:ew-resize;}
  .viz .handle.l{left:-10px;} .viz .handle.r{right:-10px;}
  .nrow{display:grid; grid-template-columns:repeat(4,1fr); gap:6px;}
  .winedit button{border:none; border-radius:8px; padding:10px 2px; font-size:11px; font-weight:700;
    background:#2a2635; color:var(--text); cursor:pointer;}
  #recbar{font-size:11.5px; color:var(--muted); text-align:center; margin:10px 0;
    font-variant-numeric:tabular-nums; min-height:16px;}
  #recbar .on{color:var(--rec); font-weight:700;}
  .toolbar{display:flex; gap:8px;}
  .toolbar button{flex:1; background:var(--surface); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:12px; font-size:13px; cursor:pointer;}
  #flash{position:fixed; top:10px; left:50%; transform:translateX(-50%); background:var(--accent);
    color:#10131a; font-weight:700; font-size:13px; padding:8px 18px; border-radius:20px;
    opacity:0; transition:opacity .15s; pointer-events:none;}
</style>
</head>
<body>
<h1>Uberloop Board</h1>
<div class="sub">Every uberloop, two decks each. Launch anything; every switch lands on the
quantize grid. Everything you play is one MIDI take.</div>

<div class="bar">
  <span class="lbl">Quantize</span>
  <select id="qsel"><option value="pulse">pulse (0.25s)</option><option value="loop">loop end</option></select>
  <button id="stopbtn">&#9632; Stop</button>
</div>

<div id="board"></div>

<div id="recbar">ready</div>
<div class="toolbar">
  <button id="dl">Download MIDI take</button>
  <button id="cleartake">Clear take</button>
</div>
<div id="flash"></div>

<script src="perform_data.js"></script>
<script>
const KEY='hnote_perform_v1';
const st=JSON.parse(localStorage.getItem(KEY)||'{}');
let winsBy=st.winsBy??{};
const NUDGE=0.1;
function persist(){ localStorage.setItem(KEY,JSON.stringify({winsBy})); }
function W(bi){ const b=PERF.beats[bi]; return winsBy[b.name]??[1.0,Math.min(3.0,b.barlen)]; }
function setW(bi,w){ winsBy[PERF.beats[bi].name]=w; persist(); }

// --- board ---
const board=document.getElementById('board');
const rows=[];
PERF.beats.forEach((b,bi)=>{
  const row=document.createElement('div'); row.className='row';
  row.innerHTML=`<div class="rinfo"><div class="rname">${b.name}</div>
    <div class="rdesc">${b.desc} · ${b.barlen.toFixed(2)}s</div></div>`;
  const bf=document.createElement('button'); bf.className='deck full';
  bf.innerHTML=`FULL<small>${b.barlen.toFixed(2)}s</small>`;
  bf.onclick=()=>launch(bi,'full');
  const bw=document.createElement('button'); bw.className='deck win';
  bw.onclick=()=>launch(bi,'win');
  const gear=document.createElement('button'); gear.className='gear'; gear.textContent='⚙';
  const edit=document.createElement('div'); edit.className='winedit';
  const viz=document.createElement('div'); viz.className='viz';
  edit.appendChild(viz);
  const nrow=document.createElement('div'); nrow.className='nrow';
  [['◀ start','s',-NUDGE],['start ▶','s',NUDGE],
   ['◀ end','e',-NUDGE],['end ▶','e',NUDGE]].forEach(([lbl,edge,d])=>{
    const btn=document.createElement('button'); btn.textContent=lbl;
    btn.onclick=()=>{
      const bl=PERF.beats[bi].barlen; let w=[...W(bi)];
      if(edge==='s') w=[Math.max(0,Math.min(w[0]+d,w[1]-0.1)),w[1]];
      else w=[w[0],Math.min(bl,Math.max(w[1]+d,w[0]+0.1))];
      setW(bi,[Math.round(w[0]*100)/100,Math.round(w[1]*100)/100]);
      updateRowLabel(bi); drawViz(bi,viz);
    };
    nrow.appendChild(btn);
  });
  edit.appendChild(nrow);
  gear.onclick=()=>{ edit.classList.toggle('show'); if(edit.classList.contains('show')) drawViz(bi,viz); };
  row.appendChild(bf); row.appendChild(bw); row.appendChild(gear);
  board.appendChild(row); board.appendChild(edit);
  rows.push({bf,bw});
  updateRowLabel(bi);
});
function updateRowLabel(bi){
  const w=W(bi);
  rows[bi].bw.innerHTML=`WIN<small>${w[0].toFixed(2)}–${w[1].toFixed(2)}s</small>`;
}
// --- fold-out visual: hits + draggable window ---
function drawViz(bi,viz){
  viz.innerHTML='';
  const b=PERF.beats[bi], bl=b.barlen, w=W(bi);
  const npulse=Math.round(bl/PERF.pulse);
  for(let k=1;k<npulse;k++){
    const g=document.createElement('div'); g.className='g'; g.style.left=(k/npulse*100)+'%';
    viz.appendChild(g);
  }
  const drumVoices=[...new Set(b.hits.filter(h=>h[3]===9).map(h=>h[1]))].sort((a,b2)=>a-b2);
  b.hits.forEach(([t,p,v,ch])=>{
    const d=document.createElement('div'); d.className='h'+(ch===3?' bass':'');
    d.style.left=(t/bl*100)+'%';
    if(ch===3) d.style.top='48px';
    else d.style.top=(10+drumVoices.indexOf(p)*(30/Math.max(drumVoices.length-1,1)))+'px';
    viz.appendChild(d);
  });
  const reg=document.createElement('div'); reg.className='wreg';
  reg.style.left=(w[0]/bl*100)+'%'; reg.style.width=((w[1]-w[0])/bl*100)+'%';
  const hl=document.createElement('div'); hl.className='handle l';
  const hr=document.createElement('div'); hr.className='handle r';
  reg.appendChild(hl); reg.appendChild(hr);
  let mode=null,x0=0,w0=null;
  const px2s=dx=>dx/viz.clientWidth*bl;
  const down=(e,m)=>{ mode=m; x0=e.clientX; w0=[...W(bi)]; e.preventDefault();
    e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId); };
  reg.onpointerdown=e=>{ if(e.target===reg) down(e,'move'); };
  hl.onpointerdown=e=>down(e,'l');
  hr.onpointerdown=e=>down(e,'r');
  const move=e=>{
    if(mode===null) return;
    const ds=px2s(e.clientX-x0);
    let w2=[...W(bi)];
    if(mode==='move'){ const len=w0[1]-w0[0];
      let a=Math.max(0,Math.min(w0[0]+ds,bl-len)); w2=[a,a+len]; }
    if(mode==='l') w2=[Math.max(0,Math.min(w0[0]+ds,W(bi)[1]-0.1)),W(bi)[1]];
    if(mode==='r') w2=[W(bi)[0],Math.min(bl,Math.max(w0[1]+ds,W(bi)[0]+0.1))];
    setW(bi,[Math.round(w2[0]*100)/100,Math.round(w2[1]*100)/100]);
    reg.style.left=(W(bi)[0]/bl*100)+'%'; reg.style.width=((W(bi)[1]-W(bi)[0])/bl*100)+'%';
    updateRowLabel(bi);
  };
  const up=()=>{ mode=null; };
  reg.onpointermove=hl.onpointermove=hr.onpointermove=move;
  reg.onpointerup=hl.onpointerup=hr.onpointerup=up;
  viz.appendChild(reg);
}
function markDecks(){
  rows.forEach((r,bi)=>{
    r.bf.classList.toggle('active', playing&&active&&active.bi===bi&&active.which==='full');
    r.bw.classList.toggle('active', playing&&active&&active.bi===bi&&active.which==='win');
    r.bf.classList.toggle('queued', !!queue&&queue.bi===bi&&queue.which==='full');
    r.bw.classList.toggle('queued', !!queue&&queue.bi===bi&&queue.which==='win');
  });
}

// --- samples ---
const SF='https://storage.googleapis.com/magentadata/js/soundfonts/sgm_plus';
const VLEV=[15,31,47,63,79,95,111,127];
let actx=null, samples={};
async function loadSamples(){
  actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const need=new Set();
  PERF.beats.forEach(b=>b.hits.forEach(([t,p,v,ch])=>{
    if(ch===3){ need.add('bass/'+p); return; }
    const vl=VLEV.reduce((a,c)=>Math.abs(c-v)<Math.abs(a-v)?c:a);
    need.add('percussion/'+p+'_'+vl);
  }));
  let done=0; const keys=[...need];
  await Promise.all(keys.map(async k=>{
    try{
      let url;
      if(k.startsWith('bass/')) url=`bass_samples/p${k.split('/')[1]}.mp3`;
      else{
        const [p,vl]=k.split('/')[1].split('_');
        url=`${SF}/percussion/p${p}_v${vl}.mp3`;
      }
      const r=await fetch(url);
      if(!r.ok) throw 0;
      samples[k]=await actx.decodeAudioData(await r.arrayBuffer());
    }catch(e){ samples[k]=null; }
    status(`samples ${++done}/${keys.length}`);
  }));
}
function status(m){ document.getElementById('recbar').textContent=m; }

// --- engine: any deck on the board, quantized switching, one take ---
let playing=false, active=null, queue=null;
let t0=0, segStart=0, schedUntil=0;
let take=[], takeStart=null, timer=null;
function loopSpec(a){
  const b=PERF.beats[a.bi], w=W(a.bi);
  return a.which==='full' ? {b, off:0, len:b.barlen} : {b, off:w[0], len:w[1]-w[0]};
}
function hitsIn(a, from, to){
  const {b,off,len}=loopSpec(a);
  const out=[];
  let iter=Math.floor((from-segStart)/len);
  for(; iter*len+segStart<to; iter++){
    const base=segStart+iter*len;
    b.hits.forEach(([t,p,v,ch])=>{
      if(t>=off-1e-9 && t<off+len-1e-9){
        const at=base+(t-off);
        if(at>=from-1e-9 && at<to-1e-9) out.push([at,p,v,ch]);
      }
    });
  }
  return out;
}
function schedule(){
  if(!playing) return;
  const now=actx.currentTime, until=now+0.18;
  while(true){
    let boundary=Infinity;
    if(queue){
      if(document.getElementById('qsel').value==='pulse'){
        boundary=t0+Math.ceil((Math.max(schedUntil,now)-t0)/PERF.pulse-1e-9)*PERF.pulse;
      }else{
        const {len}=loopSpec(active);
        boundary=segStart+Math.ceil((Math.max(schedUntil,now)-segStart)/len-1e-9)*len;
      }
    }
    const to=Math.min(until,boundary);
    if(to>schedUntil){
      hitsIn(active,schedUntil,to).forEach(h=>playHit(h));
      schedUntil=to;
    }
    if(queue && boundary<=until){
      active=queue; queue=null; segStart=boundary; markDecks();
    } else break;
  }
  updateRec();
}
function playHit([at,p,v,ch]){
  let buf,gain;
  if(ch===3){ buf=samples['bass/'+p]; gain=v/110; }
  else{
    const vl=VLEV.reduce((a,c)=>Math.abs(c-v)<Math.abs(a-v)?c:a);
    buf=samples['percussion/'+p+'_'+vl]; gain=Math.min(1.4,v/vl);
  }
  if(buf){
    const s=actx.createBufferSource(); s.buffer=buf;
    const g=actx.createGain(); g.gain.value=gain;
    s.connect(g); g.connect(actx.destination); s.start(at);
    if(ch===3){ try{s.stop(at+0.16);}catch(_){} }
  }
  if(takeStart===null) takeStart=at;
  take.push([at-takeStart,p,v,ch]);
}
async function launch(bi,which){
  if(!actx||!Object.keys(samples).length){
    await loadSamples();
  }
  if(actx.state==='suspended') await actx.resume();
  if(!playing){
    playing=true; active={bi,which};
    t0=actx.currentTime+0.12; segStart=t0; schedUntil=t0;
    timer=setInterval(schedule,50);
  }else if(!(active.bi===bi&&active.which===which)){
    queue={bi,which};
  }
  markDecks();
}
document.getElementById('stopbtn').onclick=()=>{
  playing=false; queue=null; clearInterval(timer); markDecks(); updateRec();
};
function updateRec(){
  const el=document.getElementById('recbar');
  if(take.length){
    el.innerHTML=`<span class="on">&#9679; take</span> ${take.length} notes · ${(take[take.length-1][0]).toFixed(1)}s`;
  } else el.textContent= playing? 'playing' : 'ready';
}

// --- MIDI take writer ---
function vlq(n){ const b=[n&0x7f]; n>>=7; while(n){ b.push(0x80|(n&0x7f)); n>>=7; } return b.reverse(); }
document.getElementById('dl').onclick=()=>{
  if(!take.length) return show('no take yet');
  const PPQ=480,T=500000, tick=s=>Math.round(s*1e6*PPQ/T);
  const ev=[[0,0,[0xFF,0x51,0x03,(T>>16)&255,(T>>8)&255,T&255]],[0,0,[0xC3,39]]];
  take.forEach(([t,p,v,ch])=>{
    const st=ch===3?0x93:0x99, en=ch===3?0x83:0x89;
    const dur=ch===3?0.14:0.06;
    ev.push([tick(t),1,[st,p,v]]);
    ev.push([tick(t+dur),0,[en,p,0]]);
  });
  ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const tr=[]; let last=0;
  ev.forEach(([t,,b])=>{ tr.push(...vlq(t-last),...b); last=t; });
  tr.push(0,0xFF,0x2F,0);
  const head=[0x4D,0x54,0x68,0x64,0,0,0,6,0,0,0,1,PPQ>>8,PPQ&255,
              0x4D,0x54,0x72,0x6B,(tr.length>>24)&255,(tr.length>>16)&255,(tr.length>>8)&255,tr.length&255];
  const blob=new Blob([new Uint8Array([...head,...tr])],{type:'audio/midi'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`take_board_${Date.now()%100000}.mid`;
  a.click();
  show('take downloaded');
};
document.getElementById('cleartake').onclick=()=>{ take=[]; takeStart=null; updateRec(); show('take cleared'); };
function show(m){ const f=document.getElementById('flash');
  f.textContent=m; f.style.opacity=1; setTimeout(()=>f.style.opacity=0,800); }
updateRec();
</script>
</body>
</html>
