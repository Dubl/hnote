<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>HNote — Pads</title>
<style>
  :root{
    --bg:#17151d; --line:#38334a; --text:#efeae2;
    --c1:#f5a524; --c2:#ef6351; --c3:#3ec9b0; --c4:#8d7bf5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
    user-select:none; -webkit-user-select:none;}
  html,body{margin:0; height:100%; background:var(--bg); overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  #grid{display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr;
    width:100%; height:100%; gap:2px; background:var(--line);}
  .pad{display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:800; letter-spacing:.15em; text-transform:uppercase;
    color:rgba(23,21,29,.85); cursor:pointer; transition:filter .06s;}
  .pad:nth-child(1){background:var(--c1);}
  .pad:nth-child(2){background:var(--c2);}
  .pad:nth-child(3){background:var(--c3);}
  .pad:nth-child(4){background:var(--c4);}
  .pad.hit{filter:brightness(1.6);}
  #load{position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(23,21,29,.9); color:var(--text); font-size:13px;
    padding:10px 20px; border-radius:20px; pointer-events:none; display:none;}
</style>
</head>
<body>
<div id="grid">
  <div class="pad" data-p="36">Kick</div>
  <div class="pad" data-p="38">Snare</div>
  <div class="pad" data-p="42">Hat</div>
  <div class="pad" data-p="56">Cowbell</div>
</div>
<div id="load">loading sounds…</div>

<script>
const SF='https://storage.googleapis.com/magentadata/js/soundfonts/sgm_plus/percussion';
let actx=null, samples={}, loading=false;
async function init(){
  if(actx||loading) return;
  loading=true;
  document.getElementById('load').style.display='block';
  actx=new (window.AudioContext||window.webkitAudioContext)();
  await Promise.all([36,38,42,56].map(async p=>{
    try{
      const r=await fetch(`${SF}/p${p}_v111.mp3`);
      samples[p]=await actx.decodeAudioData(await r.arrayBuffer());
    }catch(e){ samples[p]=null; }
  }));
  document.getElementById('load').style.display='none';
  loading=false;
}
function hit(p){
  const buf=samples[p];
  if(!buf) return;
  const s=actx.createBufferSource(); s.buffer=buf;
  s.connect(actx.destination); s.start();
}
document.querySelectorAll('.pad').forEach(el=>{
  el.addEventListener('pointerdown', async e=>{
    e.preventDefault();
    if(!actx) await init();
    if(actx.state==='suspended') await actx.resume();
    hit(+el.dataset.p);
    el.classList.add('hit');
    setTimeout(()=>el.classList.remove('hit'),120);
    if(navigator.vibrate) navigator.vibrate(15);
  });
});
</script>
</body>
</html>
